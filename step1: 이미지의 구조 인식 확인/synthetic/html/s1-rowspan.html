<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<!-- s1-rowspan (L1) : +C2 세로 행머리글 병합(rowspan). 구분 셀이 여러 본문 행을 묶음 -->
<style>
  body{margin:0;background:#fff;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#000;}
  .doc{display:inline-block;padding:20px;}
  h2{text-align:center;font-size:17px;margin:0 0 10px;}
  table{border-collapse:collapse;font-size:13px;width:720px;}
  td,th{border:1px solid #333;padding:6px 9px;vertical-align:middle;line-height:1.55;}
  th{background:#dcdcdc;text-align:center;font-weight:700;}
  .rh{background:#efefef;text-align:center;font-weight:700;}
  ul{margin:0;padding-left:16px;}
</style>
</head>
<body>
<div class="doc">
<h2>사업별 지원 내용</h2>
<table>
  <tr>
    <th>구분</th><th>사업명</th><th>지원대상</th><th>지원내용</th>
  </tr>
  <tr>
    <th class="rh" rowspan="2">돌봄지원</th>
    <td>아동 돌봄</td><td>만 12세 이하 아동</td>
    <td><ul><li>시간제 돌보미 파견</li><li>등·하원 동행</li></ul></td>
  </tr>
  <tr>
    <td>장애아 돌봄</td><td>등록 장애아동</td>
    <td><ul><li>전담 돌보미 매칭</li><li>활동보조 연계</li></ul></td>
  </tr>
  <tr>
    <th class="rh" rowspan="2">교육지원</th>
    <td>방과후 학습</td><td>초·중학생</td>
    <td><ul><li>교과 보충학습</li><li>학습 교구 제공</li></ul></td>
  </tr>
  <tr>
    <td>진로 상담</td><td>중·고등학생</td>
    <td><ul><li>1:1 진로설계</li><li>직업체험 연계</li></ul></td>
  </tr>
</table>
</div>
</body>
</html>
