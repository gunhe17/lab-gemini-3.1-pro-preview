<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<!-- s0-grid (L0) : 단순 N×M 격자, 단일 헤더, 병합 없음. 기준선(ceiling). 특성: 없음 -->
<style>
  body{margin:0;background:#fff;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#000;}
  .doc{display:inline-block;padding:20px;}
  h2{text-align:center;font-size:17px;margin:0 0 10px;}
  table{border-collapse:collapse;font-size:13px;width:560px;}
  td,th{border:1px solid #333;padding:6px 9px;vertical-align:middle;line-height:1.5;}
  th{background:#dcdcdc;text-align:center;font-weight:700;}
  .rh{background:#efefef;text-align:center;font-weight:700;}
  .num{text-align:right;}
</style>
</head>
<body>
<div class="doc">
<h2>분기별 예산 집행 현황</h2>
<table>
  <tr>
    <th>항목</th><th>1분기</th><th>2분기</th><th>3분기</th><th>4분기</th>
  </tr>
  <tr>
    <th class="rh">예산액</th><td class="num">12,000</td><td class="num">12,000</td><td class="num">12,000</td><td class="num">12,000</td>
  </tr>
  <tr>
    <th class="rh">집행액</th><td class="num">9,820</td><td class="num">11,140</td><td class="num">10,505</td><td class="num">12,000</td>
  </tr>
  <tr>
    <th class="rh">집행률</th><td class="num">81.8%</td><td class="num">92.8%</td><td class="num">87.5%</td><td class="num">100.0%</td>
  </tr>
  <tr>
    <th class="rh">잔액</th><td class="num">2,180</td><td class="num">860</td><td class="num">1,495</td><td class="num">0</td>
  </tr>
</table>
</div>
</body>
</html>
