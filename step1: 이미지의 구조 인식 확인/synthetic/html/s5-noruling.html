<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<!-- s5-noruling (L3) : s2-multihead와 구조·내용 동일, 괘선·헤더음영만 제거(+C8 무괘선).
     s2와 점수 차이 = 순수 괘선 의존도. "순수 구조 인식" 첫 절제 실험 -->
<style>
  body{margin:0;background:#fff;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#000;}
  .doc{display:inline-block;padding:20px;}
  h2{text-align:center;font-size:17px;margin:0 0 14px;}
  table{border-collapse:collapse;font-size:13px;width:640px;}
  td,th{border:none;padding:7px 14px;vertical-align:middle;line-height:1.5;}
  th{background:transparent;text-align:center;font-weight:700;}
  .rh{background:transparent;text-align:center;font-weight:700;}
  .num{text-align:center;}
</style>
</head>
<body>
<div class="doc">
<h2>기관별 평가 결과</h2>
<table>
  <tr>
    <th rowspan="2">기관명</th>
    <th colspan="2">정량평가</th>
    <th colspan="2">정성평가</th>
    <th rowspan="2">종합등급</th>
  </tr>
  <tr>
    <th>점수</th><th>등급</th><th>점수</th><th>등급</th>
  </tr>
  <tr>
    <th class="rh">가나복지관</th>
    <td class="num">92</td><td class="num">A</td><td class="num">88</td><td class="num">B</td>
    <td class="num">A</td>
  </tr>
  <tr>
    <th class="rh">다라센터</th>
    <td class="num">78</td><td class="num">C</td><td class="num">85</td><td class="num">B</td>
    <td class="num">B</td>
  </tr>
  <tr>
    <th class="rh">마바재단</th>
    <td class="num">95</td><td class="num">A</td><td class="num">91</td><td class="num">A</td>
    <td class="num">A</td>
  </tr>
</table>
</div>
</body>
</html>
